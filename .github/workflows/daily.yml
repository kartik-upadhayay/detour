name: Daily content

on:
  # GitHub's scheduler often runs late or skips runs, so try several times each morning.
  # Later runs exit straight away once today's content exists.
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
    - cron: "15 1 * * *"   # 06:45 IST
    - cron: "0 2 * * *"    # 07:30 IST
    - cron: "0 3 * * *"    # 08:30 IST
  # The Detour app also starts this when it wakes up to yesterday's content (GitHub's scheduler can lag hours).
  workflow_dispatch:
    inputs:
      skip_if_done:
        description: "Do nothing if today's content already exists"
        type: boolean
        default: false
      refresh_cards:
        description: "Regenerate today's words and loop cards too"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build today's content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
        run: |
          for attempt in 1 2 3; do
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.skip_if_done }}" = "true" ]; then FLAGS="--skip-if-done"; else FLAGS=""; fi
            if [ "${{ inputs.refresh_cards }}" = "true" ]; then FLAGS="$FLAGS --refresh-cards"; fi
            python pipeline/build_day.py $FLAGS && exit 0
            echo "Attempt $attempt failed, retrying in 60s"; sleep 60
          done
          exit 1

      - name: Commit
        run: |
          git config user.name "detour-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content pipeline/history.json pipeline/video_pool.json
          git diff --cached --quiet && exit 0
          git commit -m "content: $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin main
          git push
